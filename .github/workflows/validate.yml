name: Validate course pack
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: npm run release:export -- "$RUNNER_TEMP/course-pack"
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: ashinoko-course-pack
          path: ${{ runner.temp }}/course-pack
          retention-days: 14
